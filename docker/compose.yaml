services:
  supabase:
    build:
      context: .
      dockerfile: Dockerfile.supabase
    working_dir: ${PWD}/../backend
    command: start
    network_mode: host
    volumes:
      - ../backend:${PWD}/../backend
      - /var/run/docker.sock:/var/run/docker.sock

  functions:
    build:
      context: .
      dockerfile: Dockerfile.supabase
    working_dir: ${PWD}/../backend
    command: functions serve
    network_mode: host
    depends_on:
      supabase:
        condition: service_completed_successfully
    volumes:
      - ../backend:${PWD}/../backend
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    depends_on:
      supabase:
        condition: service_completed_successfully
      functions:
        condition: service_started
    env_file:
      - path: .env
        required: false
    ports:
      - "3000:3000"
    volumes:
      - ../frontend:/app
      - /app/node_modules
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 3000"